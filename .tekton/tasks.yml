apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: >-
    This task cleans up the workspace by removing all files
    and directories before or after a pipeline run.
  workspaces:
    - name: source
      description: The workspace to clean up
  steps:
    - name: remove-files
      image: registry.access.redhat.com/ubi8/ubi-minimal
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        echo "Cleaning up workspace..."
        rm -rf $(workspaces.source.path)/*
        echo "Cleanup complete."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test
spec:
  description: >-
    This task installs dependencies and runs unit tests using Jest.
  workspaces:
    - name: source
      description: The workspace containing the source code
  steps:
    - name: jest-test
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        echo "Installing dependencies..."
        npm install
        echo "Running unit tests..."
        npx jest
